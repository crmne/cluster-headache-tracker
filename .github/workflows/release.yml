name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Deploy production and publish release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production releases must use stable semver tags like v1.0.11."
            exit 1
          fi

      - name: Resolve release range
        id: release_range
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"

          if git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "Releasing ${GITHUB_REF_NAME} from ${tag_commit}."
          else
            echo "Refusing to release ${GITHUB_REF_NAME} because it is not reachable from origin/main."
            exit 1
          fi

          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"

      - name: Check release notes
        shell: bash
        run: |
          set -euo pipefail

          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"

          if [ ! -s "${notes}" ]; then
            echo "Missing ${notes}. Commit the release notes before tagging."
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Record the live sitemap for IndexNow
        run: ruby .github/scripts/indexnow.rb snapshot clusterheadachetracker.com 11ae7243683c23d16185de134c7bddca "$RUNNER_TEMP/indexnow.json"

      - name: Deploy with Kamal
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REST_PASSWORD: ${{ secrets.RESTIC_REST_PASSWORD }}
        run: bundle exec kamal deploy

      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        run: ruby .github/scripts/indexnow.rb submit "$RUNNER_TEMP/indexnow.json"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release already exists for ${GITHUB_REF_NAME}; skipping create."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "packaging/release-notes/${GITHUB_REF_NAME}.md"
          fi

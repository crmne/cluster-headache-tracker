app: cluster-headache-tracker
accessory: backup
databases:
  - name: app
    adapter: postgres
    url: postgres://cluster_headache_tracker@cluster-headache-tracker-db:5432/cluster_headache_tracker_production
    password:
      secret: POSTGRES_PASSWORD
  - name: cache
    adapter: postgres
    url: postgres://cluster_headache_tracker@cluster-headache-tracker-db:5432/cluster_headache_tracker_production_cache
    password:
      secret: POSTGRES_PASSWORD
  - name: queue
    adapter: postgres
    url: postgres://cluster_headache_tracker@cluster-headache-tracker-db:5432/cluster_headache_tracker_production_queue
    password:
      secret: POSTGRES_PASSWORD
  - name: cable
    adapter: postgres
    url: postgres://cluster_headache_tracker@cluster-headache-tracker-db:5432/cluster_headache_tracker_production_cable
    password:
      secret: POSTGRES_PASSWORD
paths:
  - /rails/storage
restic:
  repository: rest:https://backup.paolino.me/cluster-headache-tracker
  password:
    secret: RESTIC_PASSWORD
  rest:
    username:
      secret: RESTIC_REST_USER
    password:
      secret: RESTIC_REST_PASSWORD
  init_if_missing: true
  # Keep one snapshot a day for 30 days, so deleted data leaves the backups
  # within 30 days. Every other keep_* is 0, since an unset one falls back
  # to kamal-backup's default and would keep snapshots for years.
  forget_after_backup: true
  retention:
    keep_last: 0
    keep_daily: 30
    keep_weekly: 0
    keep_monthly: 0
    keep_yearly: 0
  check_after_backup: true
  check_read_data_subset: 5%
backup:
  schedule: 1d

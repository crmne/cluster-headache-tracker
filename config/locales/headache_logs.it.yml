  js:
    intensity:
      level_1: Lieve pressione all'occhio, appena percettibile.
      level_10: Dolore insopportabile, come una tortura, totalmente invalidante.
      level_2: Leggero pulsare su un lato, lieve fastidio all'occhio.
      level_3: Pressione persistente con fitte occasionali.
      level_4: Dolore acuto e pulsante all'occhio, lieve lacrimazione.
      level_5: Forte bruciore, tempia dolente, difficoltà a concentrarsi.
      level_6: Ondate di dolore lancinante, lacrimazione, naso chiuso.
      level_7: Bruciore o dolore trafittivo intenso, palpebra cadente, impedisce le attività.
      level_8: Come un ferro rovente nell'occhio, costringe a camminare avanti e indietro.
      level_9: Pressione o dolore trafittivo atroce, come se l'occhio stesse per esplodere.

    form:
      label: "Barometric pressure"
      hint: "Optional. In hPa (same as mbar), from a barometer or weather app."
      placeholder: "e.g., 1013"
    charts:
      by_pressure:
        title: "Attacks by Barometric Pressure"
        x_axis: "Pressure (hPa)"
        frequency: "Attacks"
        avg_intensity: "Avg Intensity"
      change:
        title: "Pressure Change Before Attacks"
        x_axis: "Date"
        y_axis: "Change since previous reading (hPa)"

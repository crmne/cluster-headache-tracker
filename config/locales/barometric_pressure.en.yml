        tooltip:
          change: "Change: %{value} hPa"
          pressure: "Pressure: %{value} hPa"
          hours: "Since previous reading: %{value} h"
          intensity: "Intensity: %{value}/10"

  activerecord:
    attributes:
      headache_log:
        barometric_pressure: "Barometric pressure"
    errors:
      models:
        headache_log:
          attributes:
            barometric_pressure:
              in: "must be between 870 and 1085 hPa"
              not_a_number: "must be a number in hPa"

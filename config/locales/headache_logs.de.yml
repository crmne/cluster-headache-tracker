  js:
    intensity:
      level_1: Leichter Druck am Auge, kaum spürbar.
      level_10: Unerträgliche, folterähnliche Schmerzen, völlig handlungsunfähig.
      level_2: Leichtes Pochen auf einer Seite, leichtes Unbehagen am Auge.
      level_3: Anhaltender Druck mit gelegentlichen stechenden Schmerzen.
      level_4: Stechender Augenschmerz mit Pochen, leichter Tränenfluss.
      level_5: Starkes Brennen, druckempfindliche Schläfe, beeinträchtigt die Konzentration.
      level_6: Heftige, bohrende Schmerzwellen, tränendes Auge, verstopfte Nase.
      level_7: Intensives Brennen oder Stechen, hängendes Augenlid, stört jede Tätigkeit.
      level_8: Wie ein glühender Schürhaken im Auge, zwingt zum Umhergehen.
      level_9: Extremer Druck oder Stechen, als würde das Auge gleich platzen.

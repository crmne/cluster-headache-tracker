  js:
    intensity:
      level_1: Leve presión en el ojo, apenas perceptible.
      level_10: Dolor insoportable, como una tortura, totalmente incapacitante.
      level_2: Ligero latido en un lado, leve molestia en el ojo.
      level_3: Presión persistente con punzadas ocasionales.
      level_4: Dolor agudo y pulsátil en el ojo, lagrimeo leve.
      level_5: Ardor intenso, sien sensible, cuesta concentrarse.
      level_6: Oleadas de dolor penetrante, lagrimeo, congestión nasal.
      level_7: Ardor o puñaladas intensas, párpado caído, impide hacer cosas.
      level_8: Como un hierro candente en el ojo, obliga a caminar sin parar para aliviarlo.
      level_9: Presión o puñaladas atroces, como si el ojo fuera a estallar.

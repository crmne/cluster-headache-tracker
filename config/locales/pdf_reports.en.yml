en:
  date:
    formats:
      pdf_report: "%b %-d, %Y"
      pdf_report_short: "%b %-d"
  time:
    formats:
      pdf_report_time: "%-I:%M %p"
      pdf_report_generated: "%b %-d, %Y, %-I:%M %p"

  pdf_reports:
    filename: "cluster-headache-report"
    title: "Cluster Headache Report"
    patient: "Patient"
    prepared_for: "Prepared for"
    period: "Period"
    period_range: "%{from} – %{to}"
    generated: "Generated"
